name: Build Mihomo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mihomo version"
        required: true
        default: "v1.19.24"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: mihomo-linux-amd64

          - goos: linux
            goarch: arm64
            artifact: mihomo-linux-arm64

          - goos: darwin
            goarch: arm64
            artifact: mihomo-darwin-arm64

          - goos: windows
            goarch: amd64
            artifact: mihomo-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Show Go Version
        run: go version

      - name: Build
        run: |
          chmod +x build.sh

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          OUTPUT=${{ matrix.artifact }} \
          ./build.sh "${{ github.event.inputs.version }}"

      - name: Generate SHA256
        run: |
          cd build/output
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/output/${{ matrix.artifact }}
            build/output/${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show Files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Mihomo ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: artifacts/**/*