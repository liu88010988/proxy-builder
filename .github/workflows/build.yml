name: Build Mihomo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mihomo version (optional e.g. v1.19.24)"
        required: false

  schedule:
    - cron: '0 0 * * *'

jobs:
  check-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Mihomo Version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOULD_BUILD=false
          VERSION=""

          # 手动指定版本优先
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            SHOULD_BUILD=true

            echo "Manual version: $VERSION"

          else
            # 获取最新 Mihomo release
            VERSION=$(curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | jq -r '.tag_name')

            echo "Latest Mihomo version: $VERSION"

            # API失败/null时直接跳过
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "Failed to fetch latest version"
              SHOULD_BUILD=false

            else
              # 读取当前版本
              if [ -f ".mihomo-version" ]; then
                CURRENT_VERSION=$(cat .mihomo-version | tr -d '\n\r')
              else
                CURRENT_VERSION=""
              fi

              echo "Current version: $CURRENT_VERSION"

              # 比较版本
              if [ "$VERSION" != "$CURRENT_VERSION" ]; then
                SHOULD_BUILD=true
                echo "New version detected"
              else
                SHOULD_BUILD=false
                echo "Already latest"
              fi
            fi
          fi

          echo "should-build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: check-update

    if: needs.check-update.outputs.should-build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: mihomo-linux-amd64

          - goos: linux
            goarch: arm64
            artifact: mihomo-linux-arm64

          - goos: darwin
            goarch: arm64
            artifact: mihomo-darwin-arm64

          - goos: windows
            goarch: amd64
            artifact: mihomo-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Show Go Version
        run: go version

      - name: Build
        run: |
          chmod +x build.sh

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          OUTPUT=${{ matrix.artifact }} \
          ./build.sh "${{ needs.check-update.outputs.version }}"

      - name: Generate SHA256
        run: |
          cd build/output
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/output/${{ matrix.artifact }}
            build/output/${{ matrix.artifact }}.sha256

  release:
    needs:
      - check-update
      - build

    if: needs.check-update.outputs.should-build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show Files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.version }}
          name: Mihomo ${{ needs.check-update.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/**/*

      - name: Update .mihomo-version
        run: |
          echo "${{ needs.check-update.outputs.version }}" > .mihomo-version

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .mihomo-version

          if ! git diff --cached --quiet; then
            git commit -m "Update mihomo version to ${{ needs.check-update.outputs.version }}"
            git push
          fi